# SSUET RideShare — local development stack (§2)
#   docker compose up -d db          # PostgreSQL only (run the API on the host)
#   docker compose up --build        # PostgreSQL + FastAPI
services:
  db:
    image: postgres:16-alpine
    container_name: ssuet-rideshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssuet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssuet}
      POSTGRES_DB: ${POSTGRES_DB:-ssuet_rideshare}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssuet} -d ${POSTGRES_DB:-ssuet_rideshare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssuet-rideshare-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ssuet}:${POSTGRES_PASSWORD:-ssuet}@db:5432/${POSTGRES_DB:-ssuet_rideshare}
      AUTO_CREATE_TABLES: "false"
      ENVIRONMENT: development
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  db_data:
