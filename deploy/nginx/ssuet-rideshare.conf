# nginx site for SSUET RideShare — API proxy + admin console + uploads.
#
#   sudo cp deploy/nginx/ssuet-rideshare.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/ssuet-rideshare.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# One origin serves everything: the console (static SPA), the API (/api/v1) and the
# uploaded documents (/api/v1/media/...), so the browser never needs CORS and the
# mobile app talks to the same host over TLS.

# ---------- shared settings ----------
# 5 MB upload cap in the API + headroom for multipart envelopes. Without this nginx
# answers 413 before the request ever reaches FastAPI, with a body the app cannot read.
client_max_body_size 6m;

# Edge rate limit for login/registration, on top of the API's own per-IP limiter.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;
# nginx answers 503 by default, which reads as "server broken" to a client. 429 is
# what the app and the mobile client already understand (RATE_LIMITED).
limit_req_status 429;

upstream ssuet_api {
    server 127.0.0.1:8010 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# WebSocket upgrade for the trip chat (§11).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- plain HTTP: redirect only ----------
server {
    listen 80;
    listen [::]:80;
    server_name rideshare.ssuet.edu.pk;

    # ACME challenge stays on HTTP so certificate renewal never needs a config edit.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS: everything ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rideshare.ssuet.edu.pk;

    ssl_certificate     /etc/letsencrypt/live/rideshare.ssuet.edu.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rideshare.ssuet.edu.pk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- security headers ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The console loads only its own bundle; the map tiles (if a key is configured)
    # are the single third party allowed to be framed as an image source.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/ssuet-access.log;
    error_log  /var/log/nginx/ssuet-error.log warn;

    # ---------- API ----------
    location /api/ {
        limit_req zone=api_zone burst=120 nodelay;

        proxy_pass http://ssuet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Chat sockets are long-lived; a short read timeout would drop them.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Stricter edge limit on the endpoints an attacker would hammer.
    location ~ ^/api/v1/auth/(login|register|refresh|forgot-password|reset-password)$ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://ssuet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded documents are streamed by the API (authorisation happens there);
    # buffering them here would only add latency and disk churn.
    location /api/v1/media/ {
        proxy_pass http://ssuet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    # ---------- admin console (static SPA) ----------
    root /srv/ssuet-rideshare/admin-dashboard/dist;
    index index.html;

    # Hashed build assets never change: cache them hard.
    # `expires` is used instead of `add_header` on purpose: any add_header inside a
    # location *replaces* the server-level set, which would silently drop HSTS, CSP
    # and the other security headers for these responses.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must not be cached, otherwise a deploy is invisible to the office.
    location = /index.html {
        expires -1;
    }

    # Client-side routes (/users, /reports, …) all resolve to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or the source maps to the public.
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.map$ {
        deny all;
    }
}
