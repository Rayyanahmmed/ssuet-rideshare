name: Build Android APK

# Manual only: press "Run workflow" in the Actions tab.
# Builds the APK directly on GitHub's Linux runner with prebuild + Gradle.
# No Expo cloud quota and no EXPO_TOKEN are used.
on:
  workflow_dispatch:

jobs:
  build-apk:
    name: "Build APK (profile: apk)"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install app dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the Android project (prebuild)
        working-directory: mobile
        env:
          APP_VARIANT: production
          EXPO_PUBLIC_API_URL: https://ssuet-rideshare.ethiodeploy.app/api/v1
          EXPO_PUBLIC_ALLOW_SERVER_OVERRIDE: "0"
        run: npx expo prebuild --platform android --no-install

      - name: Give Gradle enough memory (fixes OutOfMemoryError Metaspace)
        working-directory: mobile/android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          printf "%s\n" "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          grep -n "jvmargs" gradle.properties

      - name: Build the release APK with Gradle
        working-directory: mobile/android
        env:
          APP_VARIANT: production
          EXPO_PUBLIC_API_URL: https://ssuet-rideshare.ethiodeploy.app/api/v1
          EXPO_PUBLIC_ALLOW_SERVER_OVERRIDE: "0"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lintVitalAnalyzeRelease -x lintVitalRelease

      - name: Copy the APK to a fixed name
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ssuet-rideshare.apk"
          ls -lh "$RUNNER_TEMP/ssuet-rideshare.apk"

      - name: Upload the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: ssuet-rideshare-apk
          path: ${{ runner.temp }}/ssuet-rideshare.apk
          retention-days: 30