name: Build Android APK

# Runs only when you press "Run workflow" in the Actions tab.
# Builds the APK on GitHub's Linux server with `eas build --local`,
# so the Expo cloud build quota is not used.
on:
  workflow_dispatch:

jobs:
  build-apk:
    name: "Build APK (profile: apk)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 17 (needed for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Android SDK location
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install app dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build the APK locally on this runner
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Give Java/Gradle more memory (fixes "OutOfMemoryError: Metaspace")
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          eas build --local --platform android --profile apk --non-interactive --output "$RUNNER_TEMP/ssuet-rideshare.apk"

      - name: Upload the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: ssuet-rideshare-apk
          path: ${{ runner.temp }}/ssuet-rideshare.apk
          retention-days: 30
